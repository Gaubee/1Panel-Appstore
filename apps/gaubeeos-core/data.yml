title: 桌面 OS 式站点内核：订阅 GitHub 仓库作为内容源，自部署即拥有自己的站点
description: GaubeeOS 内核是一个可自部署的「桌面操作系统」式站点：内置 Rust 订阅引擎（GitHub 仓库 → 定时同步 → 本地缓存）、应用系统、终端、代码编辑器、Git 客户端与全文搜索；不内置任何内容，安装后在设置中订阅任意 GitHub markdown 仓库即可。与「GaubeeOS」（博主单体镜像）不同，本应用是通用内核，面向任何人部署

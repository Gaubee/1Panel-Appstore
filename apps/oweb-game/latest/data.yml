          labelZh: 发布钩子脚本
          required: false
          type: text
          label:
            en: Publish Hook (optional shell command run after publishing)
            ja: 公開フック（公開後に実行する任意のシェルコマンド）
            ms: Publish Hook (arahan shell pilihan dilaksana selepas penerbitan)
            pt-br: Publish Hook (comando shell opcional executado após publicar)
            ru: Publish Hook (необязательная shell-команда после публикации)
            ko: 게시 훅(게시 후 실행되는 선택적 셸 명령)
            zh-Hant: 發佈鉤子（發佈後執行的可選 shell 命令）
            zh: 发布钩子（发布后执行的可选 shell 命令）

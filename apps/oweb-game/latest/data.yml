          edit: true
          envKey: ADMIN_SECRET
          labelEn: Session Secret
          labelZh: 会话签名密钥
          required: false
          type: password
          label:
            en: Session Secret (empty = random per restart)
            ja: セッションシークレット（空欄なら再起動ごとにランダム）
            ms: Rahsia Sesi (kosong = rawak setiap mula semula)

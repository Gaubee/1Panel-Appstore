services:
  gaubeeos:
    image: ghcr.io/gaubee/gaubee.com:latest
    container_name: ${CONTAINER_NAME}
    restart: always
    ports:
      # 容器内端口 8080：Rust 静态服务器以非 root 用户运行，无法绑定 80
      - ${PANEL_APP_PORT_HTTP}:8080
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"
networks:
  1panel-network:
    external: true

title: 浏览器中的桌面操作系统式个人主页，内置终端、编辑器与 Git 客户端
description: GaubeeOS 是 gaubee.com 的自托管镜像，一个运行在浏览器中的“桌面操作系统”式个人主页：虚拟文件系统、终端、代码编辑器、Git 客户端、Markdown 博客与全文搜索，纯静态构建、自研 Rust 静态服务器托管、开箱即用
